plugins {
    id 'java'
    id 'application'
}

repositories {
    maven {
        url = 'https://repo.runelite.net'
    }
    mavenCentral()
}

dependencies {
    // RuneLite's own cache-parsing library — the same code the client uses to read item/sprite/
    // texture/model data out of a Jagex disk store, and to rasterize item icons from it.
    implementation group: 'net.runelite', name: 'cache', version: 'latest.release'
    implementation 'org.slf4j:slf4j-simple:1.7.36'
}

application {
    mainClass = 'com.splashhelper.itemicons.RenderItemIcons'
}

// net.runelite:cache itself ships class files built for 11, so this needs at least a JDK 11
// toolchain to compile against (see gradle-wrapper.properties for the matching Gradle version).
sourceCompatibility = '11'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
