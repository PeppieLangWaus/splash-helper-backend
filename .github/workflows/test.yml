name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      # --runInBand: every test file shares one globalSetup-created in-memory MongoDB instance,
      # so running files in parallel workers races clearCollections()/writes across suites.
      - run: npx jest --runInBand --forceExit --detectOpenHandles
        env:
          MONGOMS_DEBUG: '1'
